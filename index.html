<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>連立方程式ソルバー｜c,e,d から x,y を求める</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🔢 連立方程式ソルバー</h1>
    <p class="desc">
      次の式に基づいて整数解 (x, y) を求めます：<br>
      520x + 560y = a,　x + y = b,　b = c - d,　a = e - 540d<br><br>
      <small>※x, y が正の整数以外のときは棄却されます</small>
    </p>

    <!-- 入力フォーム -->
    <div class="form-row">
      <label for="c">c：</label>
      <input id="c" type="number" placeholder="整数を入力">
    </div>
    <div class="form-row">
      <label for="e">e：</label>
      <input id="e" type="number" placeholder="整数を入力">
    </div>
    <div class="form-row">
      <label for="d">d：</label>
      <input id="d" type="number" placeholder="整数を入力">
    </div>

    <button id="solveBtn">✨ 解を求める</button>

    <!-- 結果表示 -->
    <div id="result"></div>

    <hr>

    <!-- 計算履歴 -->
    <div id="history-container">
      <h2>🧮 計算履歴</h2>
      <button id="clearHistoryBtn">履歴をクリア</button>
      <ul id="history"></ul>
    </div>

    <!-- 計算式の詳細 -->
    <details class="notes">
      <summary>📘 計算過程の確認</summary>
      <p>
        b = c - d<br>
        a = e - 540d<br>
        ⇒ 520x + 560y = a, x + y = b より<br>
        y = (a - 520b) / 40,　x = b - y
      </p>
    </details>
  </div>

  <script src="script.js"></script>
</body>
</html>
